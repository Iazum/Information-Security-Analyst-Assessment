name: DAST
on:
  push: { branches: [main] }
  schedule: [{ cron: "0 2 * * *" }]   # nightly
jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t demo-app . && docker run -d -p 8000:8000 --name app demo-app
      - run: sleep 5
      - name: ZAP API scan (OpenAPI driven)
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --network host -v $(pwd)/reports:/zap/wrk ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:8000/openapi.json -f openapi \
            -r zap-report.html -J zap-report.json -I
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zap-reports, path: reports/ }
