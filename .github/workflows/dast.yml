name: dast
on:
  pull_request:
  schedule:
    - cron: '0 2 * * *'        # nightly full scan
  workflow_dispatch:

jobs:
  dast-baseline:                # fast, passive, every PR
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start app (ephemeral)
        run: |
          docker run -d --name app -p 3000:3000 bkimminich/juice-shop
          for i in $(seq 1 30); do curl -sf http://localhost:3000 >/dev/null && break; sleep 2; done
      - name: ZAP baseline (passive, 3 min spider cap)
        run: |
          mkdir -p zap && chmod 777 zap
          set +e
          docker run --rm --network host -v $(pwd)/zap:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3000 -c .zap/rules.conf -m 3 \
            -J report.json -r report.html
          rc=$?
          echo "ZAP exit code: $rc"      # 0=pass 1=FAIL rule hit 2=warnings 3+=error
          if [ $rc -eq 1 ] || [ $rc -ge 3 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zap-baseline-report, path: zap/ }

  dast-full:                    # active, nightly only
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Start app
        run: |
          docker run -d --name app -p 3000:3000 bkimminich/juice-shop
          for i in $(seq 1 30); do curl -sf http://localhost:3000 >/dev/null && break; sleep 2; done
      - name: ZAP full (active) scan, throttled
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v $(pwd)/zap:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://localhost:3000 -c .zap/rules.conf -m 5 \
            -J report.json -r report.html \
            -z "-config scanner.threadPerHost=2" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zap-full-report, path: zap/ }
